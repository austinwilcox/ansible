- name: Install Homebrew
  become: true
  ansible.builtin.command: "/bin/bash -c '{{ url }}'"
  vars:
    url: "https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh"
  when: ansible_system == "Darwin" and not is_brew_installed.stat.exists
  tags: packages

- name: Install packages on Linux
  become: true
  ansible.builtin.apt:
    name:
      # Core utilities
      - curl
      - wget
      - git
      - stow
      - vim
      - unzip
      - zip
      - dos2unix
      - tree
      - htop
      - net-tools
      - nmap
      - ssh
      - openssh-server
      # Build tools
      - build-essential
      - make
      - cmake
      - clang-format
      - python3
      # Desktop environment
      - ufw
      - tmux
      - fzf
      - xclip
      - screenkey
      - tldr
      - ripgrep
      - lxappearance
      # Applications
      - gimp
      - thunar
      - pavucontrol
      - virt-manager
      - libreoffice
      - podman
      - podman-compose
      - peek
      - filezilla
      - flameshot
      - okular
      - meld
      - obs-studio
      - flatpak
      - syncthing
      - hugo
      - pandoc
      - zsh
      # Libraries
      - libfreetype6-dev
      - libfontconfig1-dev
      - libxcb-xfixes0-dev
      - libxkbcommon-dev
    state: present
  when: ansible_system == "Linux" and ansible_pkg_mgr == "apt"
  tags: packages

- name: Install snap packages on Linux
  become: true
  community.general.snap:
    name:
      - bruno
      - mailspring
      - losslesscut
    state: present
  when: ansible_system == "Linux"
  # `snap` tag lets containers skip this -- snapd needs a real init system.
  tags:
    - packages
    - snap

- name: Install Packages on Darwin
  become: true
  community.general.homebrew:
    name:
      - curl
      - stow
      - vim
      - git
      - ufw
      - tmux
      - fzf
      - gimp
      - xclip
      - screenkey
      - tldr
      - ripgrep
      - unzip
      - brave
    state: present
  when: is_brew_installed.stat.exists
  tags: packages

# Neither fastfetch nor helix is in the Ubuntu repos. Both publish a deb with
# every GitHub release.
- name: Download fastfetch deb
  ansible.builtin.get_url:
    url: "https://github.com/fastfetch-cli/fastfetch/releases/download/{{ fastfetch_version }}/fastfetch-linux-amd64.deb"
    dest: "{{ home_dir }}/Downloads/fastfetch-{{ fastfetch_version }}-amd64.deb"
    mode: "0644"
  when: ansible_system == "Linux" and ansible_pkg_mgr == "apt"
  tags: packages

- name: Install fastfetch
  become: true
  ansible.builtin.apt:
    deb: "{{ home_dir }}/Downloads/fastfetch-{{ fastfetch_version }}-amd64.deb"
  when: ansible_system == "Linux" and ansible_pkg_mgr == "apt"
  tags: packages

- name: Download helix deb
  ansible.builtin.get_url:
    url: "https://github.com/helix-editor/helix/releases/download/{{ helix_version }}/helix_{{ helix_deb_version }}-1_amd64.deb"
    dest: "{{ home_dir }}/Downloads/helix_{{ helix_deb_version }}-1_amd64.deb"
    mode: "0644"
  when: ansible_system == "Linux" and ansible_pkg_mgr == "apt"
  tags: packages

- name: Install helix
  become: true
  ansible.builtin.apt:
    deb: "{{ home_dir }}/Downloads/helix_{{ helix_deb_version }}-1_amd64.deb"
  when: ansible_system == "Linux" and ansible_pkg_mgr == "apt"
  tags: packages
