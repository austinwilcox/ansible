- name: Check if Ghostty is installed
  ansible.builtin.shell: command -v ghostty
  register: ghostty_exists
  changed_when: false
  failed_when: false
  tags: ghostty

# Ghostty ships no official Ubuntu package and ppa:ghostty/release is gone
# (Launchpad returns 404). mkasberg/ghostty-ubuntu builds the debs that PPA
# used to serve, one per Ubuntu release.
- name: Download Ghostty deb
  ansible.builtin.get_url:
    url: "https://github.com/mkasberg/ghostty-ubuntu/releases/download/{{ ghostty_version }}/ghostty_{{ ghostty_deb_version }}_amd64_{{ ansible_distribution_version }}.deb"
    dest: "{{ home_dir }}/Downloads/ghostty_{{ ghostty_deb_version }}_amd64.deb"
    mode: "0644"
  when: ghostty_exists.rc != 0 and ansible_system == "Linux"
  tags: ghostty

- name: Install Ghostty
  become: true
  ansible.builtin.apt:
    deb: "{{ home_dir }}/Downloads/ghostty_{{ ghostty_deb_version }}_amd64.deb"
  when: ghostty_exists.rc != 0 and ansible_system == "Linux"
  tags: ghostty
