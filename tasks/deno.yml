# The installer shells out to unzip. packages.yml happens to install it first
# on a full run, but declare it here so `--tags deno` works on its own.
- name: Install Deno dependencies
  become: true
  ansible.builtin.apt:
    name: unzip
    state: present
  when: ansible_system == "Linux" and ansible_pkg_mgr == "apt"
  tags: deno

- name: Ensure Downloads folder exists
  ansible.builtin.file:
    path: "{{ home_dir }}/Downloads"
    state: directory
    mode: "0755"
  tags: deno

- name: Download Deno installer
  ansible.builtin.get_url:
    url: https://deno.land/x/install/install.sh
    dest: "{{ home_dir }}/Downloads/install-deno.sh"
    mode: "0755"
  tags: deno

- name: Install Deno
  ansible.builtin.command: "{{ home_dir }}/Downloads/install-deno.sh"
  args:
    creates: "{{ home_dir }}/.deno/bin/deno"
  tags: deno

- name: Clean up Deno installer
  ansible.builtin.file:
    path: "{{ home_dir }}/Downloads/install-deno.sh"
    state: absent
  tags: deno
